<header style="position: sticky; top: 0; z-index: 1000; width: 100%; background: #102c20; box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-bottom: 1px solid rgba(255,255,255,0.1);">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0.85rem 1.5rem; display: flex; align-items: center; justify-content: space-between;">
    
    <!-- Brand: Official Logo + Crisp Title -->
    <a href="{{ '/' | relative_url }}" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
      <img src="{{ '/img/logos/unifisher-farming.jpeg' | relative_url }}" 
           alt="Unifisher Farming Logo" 
           style="height: 48px; width: 48px; object-fit: contain; border-radius: 8px; background: #ffffff; padding: 2px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
      <span style="color: #ffffff; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        Unifisher Farming
      </span>
    </a>

    <!-- Navigation Links & WhatsApp Action -->
    <nav style="display: flex; align-items: center; gap: 2rem;">
      <a href="#products" style="color: rgba(255, 255, 255, 0.9); font-size: 0.95rem; font-weight: 500; text-decoration: none; transition: color 0.2s;">Products</a>
      <a href="#about" style="color: rgba(255, 255, 255, 0.9); font-size: 0.95rem; font-weight: 500; text-decoration: none; transition: color 0.2s;">About</a>
      <a href="#contact" style="color: rgba(255, 255, 255, 0.9); font-size: 0.95rem; font-weight: 500; text-decoration: none; transition: color 0.2s;">Contact</a>
      
      <!-- High-Contrast Enquiry Button -->
      <a href="https://wa.me/{{ site.whatsapp_number }}" target="_blank" rel="noopener" 
         style="background: #d4a93d; color: #102c20; font-size: 0.9rem; font-weight: 700; padding: 0.55rem 1.25rem; border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 10px rgba(212,169,61,0.3); transition: transform 0.15s ease;">
        <span>Enquire</span> ↗
      </a>
    </nav>

  </div>
</header>
