<section id="team" class="team-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading">Our Team</h2>
        <p class="section-subheading">A dedicated team working toward greener farming and better food quality.</p>
      </div>
    </div>

    <div class="row">
      {% for member in site.people %}
      <div class="col-sm-4">
        <div class="team-member">
          <img src="img/team/{{ member.pic }}.jpg" class="img-responsive img-circle" alt="{{ member.name }}">
          <h4>{{ member.name }}</h4>
          <p class="text-muted">{{ member.position | default: 'Founder' }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
