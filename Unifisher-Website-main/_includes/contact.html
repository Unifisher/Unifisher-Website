<section id="contact" class="contact-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2 class="section-heading">Contact Us</h2>
        <p class="section-subheading">We’d love to hear from you.</p>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-8 col-lg-offset-2">
        <form name="sentMessage" id="contactForm" novalidate>
          <div class="row">
            <div class="col-md-6">
              <div class="control-group form-group">
                <input type="text" class="form-control" placeholder="Your Name *" id="name" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="control-group form-group">
                <input type="email" class="form-control" placeholder="Your Email *" id="email" required>
              </div>
            </div>
            <div class="col-md-12">
              <div class="control-group form-group">
                <input type="tel" class="form-control" placeholder="Your Phone *" id="phone" required>
              </div>
            </div>
            <div class="col-md-12">
              <div class="control-group form-group">
                <textarea class="form-control" placeholder="Your Message *" id="message" required></textarea>
              </div>
            </div>
            <div class="col-lg-12 text-center">
              <button type="submit" class="btn btn-xl btn-primary">Send Message</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
