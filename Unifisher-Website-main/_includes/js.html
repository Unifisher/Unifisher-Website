<script>
(function () {
  'use strict';
  var nav = document.getElementById('primary-navigation');
  var toggle = document.querySelector('.nav-toggle');
  if (toggle && nav) {
    toggle.addEventListener('click', function () {
      var open = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!open));
      nav.classList.toggle('is-open', !open);
      toggle.setAttribute('aria-label', open ? 'Open navigation' : 'Close navigation');
    });
    nav.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        nav.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Open navigation');
      });
    });
  }

  var whatsappNumber = '{{ site.whatsapp_number | default: "" | escape }}'.replace(/[^0-9]/g, '');
  document.querySelectorAll('.js-whatsapp-link').forEach(function (link) {
    var message = link.getAttribute('data-message') || 'Hello Unifisher Farming, I would like to enquire.';
    link.addEventListener('click', function () {
      if (typeof window.gtag === 'function' && whatsappNumber) {
        window.gtag('event', 'whatsapp_click', {
          link_text: (link.textContent || '').trim().slice(0, 100),
          page_path: window.location.pathname,
          transport_type: 'beacon'
        });
      }
    });
    if (whatsappNumber) {
      link.href = 'https://wa.me/' + whatsappNumber + '?text=' + encodeURIComponent(message);
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
    } else {
      link.href = '#contact';
      link.addEventListener('click', function (event) {
        var note = document.querySelector('.js-whatsapp-note');
        if (note) note.hidden = false;
      });
    }
  });

  var form = document.getElementById('contactForm');
  if (form) {
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var status = document.getElementById('formStatus');
      if (!form.reportValidity()) return;
      var name = form.elements.name.value.trim();
      var email = form.elements.email.value.trim();
      var phone = form.elements.phone.value.trim();
      var message = form.elements.message.value.trim();
      if (!name || !email || !message) {
        status.textContent = 'Please complete the required fields.';
        return;
      }
      var body = 'Name: ' + name + '\nEmail: ' + email + '\nPhone / WhatsApp: ' + (phone || 'Not provided') + '\n\nEnquiry:\n' + message;
      var subject = 'Website enquiry from ' + name;
      status.textContent = 'Your email app should open with the enquiry. Please review it and press Send to contact us.';
      window.location.href = 'mailto:{{ site.email }}?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    });
  }
})();
</script>
